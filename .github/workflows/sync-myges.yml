name: Sync myGES

# Régénère planning.ics régulièrement et le commit dans le repo.
# Apple Calendar s'abonne ensuite à l'URL raw du fichier -> sync auto.

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (heure UTC, best-effort)
  workflow_dispatch: {}       # + un bouton "Run workflow" pour tester à la main

permissions:
  contents: write             # pour que le workflow puisse committer le .ics

concurrency:
  group: sync-myges
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Generer le .ics
        env:
          MYGES_USER: ${{ secrets.MYGES_USER }}
          MYGES_PASS: ${{ secrets.MYGES_PASS }}
        run: python3 myges_ics.py --out planning.ics --past 30 --future 150

      - name: Publier si modifie
        run: |
          git add planning.ics
          if git diff --cached --quiet; then
            echo "Aucun changement, rien a publier."
          else
            git config user.name  "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "maj planning $(date -u +%FT%TZ)"
            git push
          fi
